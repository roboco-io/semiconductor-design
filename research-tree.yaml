      QoR 개선)가 2배 이상 달라지며, 구독 요금제 기준 실측이 가능하다.
    parent: "H1"
    motivation: "Token ROI는 FluxBench가 지표만 제안, 구독 요금제 실측 데이터는 전무."
    status: approved
    judgment:
      novelty: true
      importance: medium
      feasibility: true
      falsifiability: true
      already_solved: false
      verdict: approved      # Operator 승인 2026-08-25 (H1 부속)
      rationale: "H1 실험에 계측만 추가하면 부수적으로 얻어짐 — 한계 비용 낮음."
