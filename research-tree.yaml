field_understanding:
  scope: "2026-09-24 공개 근거 재조사; EXPLORATORY, 현업 접근 없음"
  sota_summary: >
    기존 후보의 기능 중 커버리지 통합(pyucis), RTL 오류 입력 축소(sv-bugpoint),
    파형 질의·비교, STDF 병합·집계, 불확실성 기반 공정 실측 선택은 이미 대안이 있다.
    구체적인 공개 신고와 소스가 있는 STDF→ATDF 검사 결과 의미 보존(P1)을
    먼저 검증하도록 제안한다. 수정된 비트 오류는 현재 공백으로 세지 않으며,
    최신 코드 실행·원 명세 대조·독립 도구의 추가 가치는 아직 미확인이다.
    제품 수요나 특정 기업 도입 의사는 확인되지 않았다.
  evidence_path: "literature/problem-selection-2026-09-24.md"
  search_log_path: "literature/raw/07-problem-selection-search-log.json"
  key_papers:
    - {id: "R15", title: "WaveformQA: Benchmarking LLM Temporal Reasoning on Digital Waveforms", year: 2026, relevance: "파형 시간 질의의 공개 평가 후보; 코드 접근 미확인"}
    - {id: "R20", title: "A Comparative Study of Semiconductor Virtual Metrology Methods and Novel Algorithmic Framework for Dynamic Sampling", year: 2025, relevance: "불확실성 기반 동적 실측의 기존 비교자"}
    - {id: "R23", title: "Wafer Defect Root Cause Analysis with Partial Trajectory Regression", year: 2025, relevance: "실제 fab 경로 데이터가 필요한 원인 추적 연구"}
  open_problems:
    - "최신 STDF 변환기에서도 빈 재시험 필드의 의미 손실이 재현되는가?"
    - "기존 라이브러리 수정으로 충분한가, 독립 검사 도구가 필요한 반복 사례가 있는가?"
    - "파형·CMP 후보의 실제 파일·사용 조건·로컬 평가 경로를 확보할 수 있는가?"
    - "공개 기술 평가가 개선하는 실제 업무 판단은 무엇인가?"
  underexplored_areas:
    - "아직 미확정: 검색에서 발견하지 못한 기능을 부재로 주장하지 않는다."

