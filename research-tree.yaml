# Research Tree — 제로베이스 사이클 (2026-08-25 시작)
# 이전 사이클: tag archive/pre-eda-zerobase-pivot-2026-08-25 참조 (근거로 사용 금지)

project:
  title: "범용 코딩 에이전트의 EDA 하네스 설계 연구 (H1 주축)"
  domain: "Electronic Design Automation (EDA)"
  started: "2026-08-25"
  status: active

field_understanding:
  sota_summary: >
    RTL 생성은 구세대 벤치마크(VerilogEval v1/RTLLM) 95%+ 포화·오염 확인 후
    신세대 실무형 벤치마크(CVDP ≤34%, RealBench 시스템 0%)로 전선 이동.
    검증은 개발주기 70% 병목임에도 연구 밀도가 생성 대비 2년 뒤처지며 SVA 유효율
    약 44% 수준. 물리 설계는 AlphaChip 논쟁이 남긴 "중간지표≠최종 PPA" 평가 문제가
    화두. 에이전틱 플로우는 모듈 L3·플로우 L2 수준이고, FluxBench(2026)가 동일 모델에서
    하네스 아키텍처 차이로 86% 성능 격차를 실증 — 그러나 하네스 설계 자체의 연구는 공백.
    교육·학습 측정 축은 전 영역에서 경쟁 밀도가 가장 낮다.
    상세: literature/survey.md
  key_papers:
    - id: "fluxbench-2026"
      title: "FluxBench: Can AI Agents Really Complete RTL-to-GDS?"
      year: 2026
      relevance: "하네스 아키텍처가 지배 변수임을 실증(86% 격차, Token ROI 지표). H1의 비교 기반"
    - id: "cvdp-2025"
      title: "CVDP (NVIDIA, 783 problems)"
      year: 2025
      relevance: "오픈소스 툴 기반 차세대 벤치마크, 에이전틱 검증 태스크 최난도 실증"
    - id: "correctbench-2024"
      title: "CorrectBench: self-validation testbench generation"
      year: 2024
      relevance: "self-validation의 한계 실증 — H2(교차 엔진 검증)의 대조 기준"
    - id: "chipbench-e2e-2024"
      title: "ChiPBench: end-to-end AI placer 평가"
      year: 2024
      relevance: "중간지표≠최종 PPA 해리 실증 — H4(sign-off 게이트 평가)의 선례"
    - id: "vericontaminated-2025"
      title: "VeriContaminated"
      year: 2025
      relevance: "VerilogEval/RTLLM 오염 정량화 — H3(오염-내성 평가셋)의 동기"
    - id: "krupp-education-2026"
      title: "LLM 기반 칩설계 교육 플랫폼 (Krupp·Venn·Wehn)"
      year: 2026
      relevance: "학습 곡선 정량화를 future work로 명시 — H5(학습 축)의 공백 증거"
    - id: "agentic-eda-survey-2025"
      title: "The Dawn of Agentic EDA (survey)"
      year: 2025
      relevance: "자율성 L1-L4 분류 체계 — 난이도 사다리 정의에 재사용 가능"
  open_problems:
    - "평가 위기: pass@k 포화 + 오염 + sign-off/PPA 게이트 부재 + 중간지표-최종성능 해리"
    - "검증 병목: 자동·신뢰 가능한 검증 환경 부재 (RLVR·에이전트 루프·실무 채택 공통 병목)"
    - "하네스 설계 지식 부재: 성능 지배 변수임이 실증됐으나 설계 원리 미연구"
    - "비용 계측 부재: 토큰·반복·인간 개입량이 평가에서 누락"
    - "인간 학습 축 부재: AI 협업 설계에서 성과-학습 해리 측정 도구 없음"
  underexplored_areas:
    - "범용 CLI 에이전트 + EDA 스킬/하네스 설계 연구 (공백, 로컬 가능)"
    - "교차 엔진(생성≠심사) 검증 체계 평가 (공백, 로컬 가능)"
    - "기능 정합 통과 RTL의 sign-off 게이트 통과율 (초기, 로컬 가능)"
    - "Tiny Tapeout 코퍼스 living benchmark (초기, novelty 재확인 필요)"
    - "AI 협업 설계의 학습 축 정량 측정 (공백, N=1 종단 가능)"
    - "구독 요금제 Token ROI 실측 (공백, 로컬 가능)"

hypotheses:
  - id: "H1"
    statement: >
      체계적으로 설계한 EDA 스킬·하네스를 범용 코딩 에이전트(Claude Code)에 장착하면,
      FluxBench류 RTL→GDS 태스크에서 하네스 없는 동일 모델 baseline 대비
      플로우 완주율이 유의하게(목표 ≥2배) 개선된다.
    parent: null
    motivation: >
      FluxBench가 하네스 아키텍처로 86% 성능 격차·범용 CLI 8.4배 열세를 실증했으나
      "하네스를 어떻게 설계해야 하는가"는 미연구 공백. 비교 지표(완주율·QoR·Token ROI)가
      공개돼 있어 1인 연구로 측정 가능한 기여.
    status: approved
    judgment:
      novelty: true
      importance: high
      feasibility: true
      falsifiability: true
      already_solved: false
      verdict: approved      # Operator 승인 2026-08-25 (issue 001)
      rationale: "FluxBench 명시 공백. 로컬 ORFS+구독 CLI로 실행 가능. baseline 대비 실패 시 refuted 판정 가능."
    experiment:
      design_summary: >
        Phase A 스모크(3태스크×조건당 3시행=18세션, B0 baseline vs T1 하네스,
        SKY130+LibreLane 로컬): 4-way 게이트(환경/headroom/방향/무신호).
        H1 정식 판정(≥2배+Fisher, N≥15)은 Phase B — 규칙은 지금 고정.
      protocol_path: "experiments/H1-harness/protocol.md"
      status: locked          # 2026-08-25 Codex 게이트 4차 approve
    results: {summary: "", outcome: null, key_metrics: [], artifacts_path: ""}
    children: ["H1.1"]

