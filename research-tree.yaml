      year: 2025
      relevance: "1인 시작 도구의 채택 성공 공식: 기존 포맷 + 나은 UX + 임베드 가능"
    - id: "metrics21-autotuner"
      title: "METRICS2.1 + AutoTuner (ICCAD 2021)"
      year: 2021
      relevance: "표준 메트릭 포맷 존재 — C1 실험 추적 도구·C4 예측기의 데이터 기반"
    - id: "eda-schema-v2"
      title: "EDA-Schema-V2 (OpenROAD+오픈 PDK, 7,776 인스턴스)"
      year: 2026
      relevance: "C4 QoR 예측기의 공개 베이스라인·비교 프로토콜"
    - id: "woset-joss"
      title: "WOSET / JOSS 심사 기준"
      year: 2024
      relevance: "도구의 학술 인정 경로 — repo 공개·CI·impact 증거 요건"
  open_problems:
