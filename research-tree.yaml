# Research Tree — 사이클 3 (2026-08-25 오후 시작)
# 이전: tag archive/eda-harness-cycle-2026-08-25 (하네스 연구), archive/pre-eda-zerobase-pivot-2026-08-25 (구 바이브코딩 INTENT)
# 이전 사이클 자산을 근거로 사용 금지

project:
  title: "반도체 설계에 유용한 SW/모델의 바이브 코딩 개발 — 4트랙 병렬 (A:실험추적+QoR, B:STA분석기, C:플로우닥터, D:IR drop 모델)"
  domain: "EDA 실용 소프트웨어/모델 개발 (vibe coding)"
  started: "2026-08-25"
  status: active

# Operator가 고정한 의도 (2026-08-25):
# "핵심은 반도체 설계에 있어서 유용한 소프트웨어 또는 모델을 바이브 코딩 기법으로 개발하는 것"
# → 연구 산출물 = 설계 현장에 실제 쓸모 있는 소프트웨어/모델. 바이브 코딩은 개발 방법.

field_understanding:
  sota_summary: >
    오픈소스 EDA는 엔진 계층(OpenROAD/LibreLane/Verilator/cocotb)은 성숙했으나
    해석(타이밍 리포트·실패 로그)·검증 관리(커버리지 통합·회귀 triage)·실험 관리
    (run 추적 — "하드웨어판 MLflow" 부재) 계층이 공백. 소형 ML 모델은 공개 데이터셋
    (CircuitNet·EDA-Schema·ICCAD'23 IR)이 성숙했고 tabular QoR 조기 예측은 무주공산.
    바이브 코딩 방법론은 Normal Computing(1인+AI 43일 580K줄 검증 스택)·Meta CoreSmith
    등으로 실증 단계 — 품질 담보는 기계적 게이트(외부 벤치마크·형식검증·sign-off).
    유용성의 객관 검증 경로(외부 벤치마크 > 채택 증거 > 시간 절감 표)와 학술 진입로
    (WOSET/JOSS/ICCAD tool paper)가 명확히 존재. 상세: literature/survey.md
  key_papers:
    - id: "normal-circt-2026"
      title: "Building an open-source Verilog simulator with AI (580K lines in 43 days)"
      year: 2026
      relevance: "1인+AI 게이트 기반 개발의 실증 선례 — 본 프로젝트 방법론의 직접 근거"
    - id: "surfer-cav-2025"
      title: "Surfer waveform viewer (CAV 2025)"
      year: 2025
      relevance: "1인 시작 도구의 채택 성공 공식: 기존 포맷 + 나은 UX + 임베드 가능"
    - id: "metrics21-autotuner"
      title: "METRICS2.1 + AutoTuner (ICCAD 2021)"
      year: 2021
      relevance: "표준 메트릭 포맷 존재 — C1 실험 추적 도구·C4 예측기의 데이터 기반"
    - id: "eda-schema-v2"
      title: "EDA-Schema-V2 (OpenROAD+오픈 PDK, 7,776 인스턴스)"
      year: 2026
      relevance: "C4 QoR 예측기의 공개 베이스라인·비교 프로토콜"
    - id: "woset-joss"
      title: "WOSET / JOSS 심사 기준"
      year: 2024
      relevance: "도구의 학술 인정 경로 — repo 공개·CI·impact 증거 요건"
  open_problems:
    - "타이밍 리포트·실패 로그의 해석 계층 부재 (OR #1759, OpenLane #1183, mcp#96)"
    - "run 추적·비교 도구 부재 — METRICS2.1 포맷은 있으나 하드웨어판 MLflow 없음"
    - "커버리지 이원화(cocotb/Verilator)로 merge·시각화 불가 — cocotb 설문 최다 불만"
    - "tabular QoR 조기 예측의 공개 베이스라인·리더보드 부재 (무주공산)"
    - "sby 반례 재실행 불가 (sby #300), 회귀 실패 triage 수작업"
  underexplored_areas:
    - "C1 실험 추적 도구 (공백 전수 확인, 도그푸딩 경로)"
    - "C4 QoR 조기 예측기 (CPU 학습, EDA-Schema 비교 프로토콜 존재)"
    - "C2 STA 리포트 분석기 (수요 근거 최다, 코어팀 리스크 있음)"
    - "C3 플로우 실패 진단기 / C5 회귀 triage / C6 커버리지 통합 / C7 sby 브리지 / C8 IR drop 모델 / C9 tt-doctor"

hypotheses:
  - id: "H1"
    statement: >
      게이트 기반 바이브 코딩으로 개발한 RTL-to-GDS 실험 추적·비교 도구(METRICS2.1
      수집→run 디프·파라미터-결과 상관 대시보드)는, 사전 고정 유용성 기준(메트릭 수집
      정합성 + 수작업 대비 run 비교 시간 절감 + 외부 사용 증거)을 충족한다.
    parent: null
    motivation: >
      "하드웨어판 MLflow"의 부재가 도구 전수 비교로 확인된 공백(HBS 논문·ORFS 문서),
      수작업 사례(OR #7482, endraws 블로그) 존재. 도그푸딩 경로가 자연스럽고
      C4(QoR 예측기)의 데이터 인프라를 겸한다. WOSET/JOSS 진입 요건과 정합.
    status: completed
    judgment:
      novelty: true
      importance: high
      feasibility: true
      falsifiability: true
      already_solved: false
      verdict: approved    # Operator 2026-08-25: A/B/C/D 전 트랙 병렬 승인
      rationale: "순수 SW·로컬. 유용성 기준은 protocol에서 사전 고정."
    experiment:
      design_summary: >
        spm 단일 설계 21-run 코퍼스(밀도PCT×클럭 격자) + ORFS 정적 코퍼스.
        K1 전수 원문 토큰 정합(독립 오라클), K2 시간 절감 ≥50%(자동 계측·도구 불리 보수 규칙),
        K4 외부 사용 증거(Release 앵커+60일 창). 2단계 판정, 14일 창.
      protocol_path: "experiments/A-run-tracker/protocol.md"
      status: done            # 1차 판정 완료 2026-08-25
    results:
      summary: >
        K1 통과(8,837키 불일치 0·21/21 완주)·K3 통과(Codex 3차 왕복). K2 실패:
        절감 24% < 50% — AI 에이전트가 양 조건 수행자라 baseline이 극도로 빠르고
        scan 고정비가 지배. 트리 §6-2 refuted. 상세: experiments/A-run-tracker/results.md
      outcome: refuted
      key_metrics:
        - {metric: "K2 time saving", value: 0.24, baseline_value: 0.50, delta: -0.26}
        - {metric: "K1 token mismatches", value: 0, baseline_value: 0, delta: 0}
      artifacts_path: "semiconductor-design-tracks/A-run-tracker/results/"
    children: ["H1.1"]

  - id: "H1.1"
    statement: >
      H1 도구가 수집한 METRICS2.1 데이터로 학습한 tabular QoR 조기 예측기
      (XGBoost/LightGBM)는 leave-one-design-out 스플릿에서 OpenROAD 자체 stage별
      추정치(EDA-Schema 베이스라인) 대비 post-route 예측 MAE를 유의하게 낮추고,
      AutoTuner 탐색에 조기중단 추천으로 통합 시 총 탐색 시간을 단축한다.
    parent: "H1"
    motivation: >
      tabular QoR 조기 예측은 표준 스플릿·리더보드·GBDT 공개 구현이 없는 무주공산.
      상용(DSO.ai·Cerebrus)이 파는 가치의 오픈소스 공백. CPU 수 분 학습.
    status: approved
    judgment:
      novelty: true
      importance: high
      feasibility: true
      falsifiability: true
      already_solved: false
      verdict: approved    # Operator 2026-08-25 (H1 Phase 2)
      rationale: "'소프트웨어+모델' 의도를 한 로드맵으로 충족."
    experiment: {design_summary: "", protocol_path: "", status: not_started}
    results: {summary: "", outcome: null, key_metrics: [], artifacts_path: ""}
    children: []

  - id: "H2"
    statement: >
      STA 리포트 분석기(report_checks→구조화 JSON+HTML 시각화, CLI+MCP)는 ORFS 예제
      전수에서 원본 리포트와 100% 수치 정합(golden diff)을 달성하고, 공개 후 외부
      사용 증거를 확보한다.
    parent: null
    motivation: >
      수요 근거 최다(OR #1759·#10020·#9371·#4633 + openroad-mcp #96 "Impact: High").
      AI 타이밍 클로저의 전제 부품. 단 OpenROAD 코어팀이 직접 구현할 리스크.
    status: approved
    judgment:
      novelty: true
      importance: high
      feasibility: true
      falsifiability: true
      already_solved: false
      verdict: approved    # Operator 2026-08-25: 병렬 트랙 B
