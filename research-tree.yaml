  - id: "H3"
    statement: >
      플로우 실패 진단기(log doctor: LibreLane/ORFS 런 디렉토리→실패 시그니처 매칭→
      원인·수정 제안)는 공개 실패 사례 코퍼스 백테스트에서 사전 고정 적중률 기준을
      충족한다.
    parent: null
    motivation: >
      "거의 모두가 겪는" 최대 페인포인트(OpenLane #1183) + 메인테이너 명시 요청(OR #7482).
      단 진단 지식 코퍼스 구축 비용과 적중률 검증의 난도가 높음.
    status: completed
    judgment:
      novelty: true
      importance: high
      feasibility: true
      falsifiability: true
      already_solved: false
      verdict: approved    # Operator 2026-08-25: 병렬 트랙 C
      rationale: "실패 사례 코퍼스 수집이 선행 투자 — 트랙 내 1단계로 편입."
    experiment:
      design_summary: >
        코퍼스 46건(개발 32/홀드아웃 14 사전등록 분할). 룰 DB는 개발용만으로 별도 에이전트가 구축,
        홀드아웃 입력은 기계 추출(코드펜스 연결). 판정: hits ≥ ceil(0.60N) supported /
        ceil(0.40N)-경계 inconclusive / 미만 refuted (N ≥ 10 필수). 교차 오염 감사 N′ 병기. 14일 창.
      protocol_path: "experiments/C-flow-doctor/protocol.md"
      status: done            # 백테스트 완료 2026-08-25
    results:
