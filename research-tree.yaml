        hits 0/11 (기계 miss 9 + Codex 심사 miss 2). 재대입 32/32 대비 홀드아웃 0% —
        룰 DB의 전형적 과적합. unknown 정직 출력으로 오진 0. N′=10에서도 0.
        상세: experiments/C-flow-doctor/results.md
      outcome: refuted
