# frozen encoder 프리트레인 코퍼스 manifest — 학습 전 선커밋 (spec §5, anti-tuning-knob).
# 이 파일은 결과를 보고 사후에 바꾸지 않는다: 설계 선정·제외 규칙은 모두 학습 착수 전 고정.
#
# Step 1 조사(2026-07-02, gh api):
#   gh api repos/The-OpenROAD-Project/OpenROAD-flow-scripts/contents/flow/designs/sky130hd
#   gh api repos/The-OpenROAD-Project/OpenROAD-flow-scripts/contents/flow/designs/sky130hs
# sky130hd: aes, chameleon, gcd, ibex, jpeg, microwatt, riscv32i (7)
# sky130hs: aes, gcd, ibex, jpeg, riscv32i (5, 모두 sky130hd와 이름 중복)
# 로더가 designs 내 이름 중복을 금지하므로(unique name 제약), ORFS sky130hd/hs에
# 동봉된 고유 설계 이름은 실제로 7개뿐이다 — spec §5 "목표 ~20"에 못 미치지만
# 임의로 설계를 추가하지 않고 존재하는 7개 전부를 채택한다(brief 지시대로).
# 모든 설계가 sky130hd에 존재하므로(sky130hd가 상위집합) platform은 전부 sky130hd로 고정 —
# 플랫폼 혼합에 따른 임의성을 배제.
version: 1
pdk_family: sky130
orfs_image_digest: "sha256:b19fe0a514a87aee0f97073797395c0ca489c45406b526bc75fd2038c82fdf69"
designs:
  - {name: gcd, platform: sky130hd}
  - {name: aes, platform: sky130hd}
  - {name: ibex, platform: sky130hd}
  - {name: jpeg, platform: sky130hd}
  - {name: riscv32i, platform: sky130hd}
  - {name: chameleon, platform: sky130hd}
  - {name: microwatt, platform: sky130hd}
# encoder_val: label 4설계(gcd/aes/ibex/jpeg)와 겹치지 않는 나머지 3개(riscv32i/chameleon/
# microwatt) 중 크기가 다른 2개를 선정 — riscv32i(소형: config.mk에 CORE_UTILIZATION 외
# 별다른 매크로/메모리 튜닝 없음, 가장 단순한 RTL)와 chameleon(중형: soc_core — AHB/APB
# 주변장치 다수를 통합한 SoC, ibex 코어 blackbox 포함, CORE_UTILIZATION=60·CORE_ASPECT_RATIO
# 지정 등 배치 복잡도 ↑). microwatt는 DIE_AREA 명시 고정·MACRO_PLACE_HALO·대용량 메모리 설정
# 등 셋 중 가장 크고 복잡해 val 세트에서 제외(대형은 label 쪽 특성과 더 가까움).
encoder_val_designs: [riscv32i, chameleon]
label_designs: [gcd, aes, ibex, jpeg]
exclusion_rules:
  - "yosys synth exit code != 0"
  - "extracted endpoints < 10"
exclusions: []
